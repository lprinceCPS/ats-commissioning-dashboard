<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Commissioning Tracker — TeraWulf Lake Mariner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: #0a0e27;
            color: #e4e7eb;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #1e293b;
            margin-bottom: 30px;
        }

        header img {
            max-width: 250px;
            margin-bottom: 15px;
            filter: brightness(0) invert(1);
        }

        header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        header p {
            font-size: 16px;
            color: #94a3b8;
        }

        .dh-toggle {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .dh-btn {
            padding: 12px 30px;
            background: #1e293b;
            border: 2px solid #334155;
            color: #e4e7eb;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .dh-btn:hover {
            background: #334155;
            border-color: #475569;
        }

        .dh-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .kpi-value {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .kpi-label {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-card.complete .kpi-value { color: #10b981; }
        .kpi-card.l3only .kpi-value { color: #f59e0b; }
        .kpi-card.l4only .kpi-value { color: #f97316; }
        .kpi-card.missing .kpi-value { color: #ef4444; }

        .section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: #3b82f6;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .badge.success { background: #10b981; }
        .badge.warning { background: #f59e0b; }
        .badge.danger { background: #ef4444; }

        .hac-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .hac-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #334155;
            text-align: center;
            transition: all 0.2s;
        }

        .hac-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
        }

        .hac-card.complete {
            border-color: #10b981;
            background: #064e3b;
        }

        .hac-card.partial {
            border-color: #f59e0b;
            background: #78350f;
        }

        .hac-card.incomplete {
            border-color: #ef4444;
            background: #7f1d1d;
        }

        .hac-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }

        .hac-progress {
            font-size: 14px;
            color: #94a3b8;
        }

        .hac-percent {
            font-size: 24px;
            font-weight: 700;
            margin-top: 8px;
        }

        .hac-card.complete .hac-percent { color: #10b981; }
        .hac-card.partial .hac-percent { color: #f59e0b; }
        .hac-card.incomplete .hac-percent { color: #ef4444; }

        .row-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .row-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
        }

        .row-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .row-header:hover {
            background: #334155;
        }
        
        .row-header.complete-row {
            background: #064e3b;
            border-left: 4px solid #10b981;
        }
        
        .row-header.complete-row:hover {
            background: #065f46;
        }

        .row-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .row-summary {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
        }

        .row-stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .row-stat-label {
            color: #94a3b8;
        }

        .row-stat-value {
            font-weight: 600;
            color: #fff;
        }

        .row-stat.complete .row-stat-value { color: #10b981; }
        .row-stat.l3only .row-stat-value { color: #f59e0b; }
        .row-stat.l4only .row-stat-value { color: #f97316; }
        .row-stat.missing .row-stat-value { color: #ef4444; }

        .row-content {
            display: none;
            padding: 20px;
            border-top: 1px solid #334155;
            background: #0f172a;
        }

        .row-content.expanded {
            display: block;
        }

        .ats-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .ats-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ats-cell:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .ats-cell.complete {
            background: #064e3b;
            border-color: #10b981;
            color: #10b981;
        }

        .ats-cell.l3only {
            background: #78350f;
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .ats-cell.l4only {
            background: #7c2d12;
            border-color: #f97316;
            color: #f97316;
        }

        .ats-cell.missing {
            background: #7f1d1d;
            border-color: #ef4444;
            color: #ef4444;
        }

        .ats-number {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .ats-status {
            font-size: 10px;
            opacity: 0.8;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid;
        }

        .legend-color.complete {
            background: #064e3b;
            border-color: #10b981;
        }

        .legend-color.l3only {
            background: #78350f;
            border-color: #f59e0b;
        }

        .legend-color.l4only {
            background: #7c2d12;
            border-color: #f97316;
        }

        .legend-color.missing {
            background: #7f1d1d;
            border-color: #ef4444;
        }

        .complete-rows {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .complete-row-item {
            background: #064e3b;
            border: 2px solid #10b981;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            color: #10b981;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }

        thead {
            background: #0f172a;
        }

        th {
            padding: 15px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #334155;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }

        tr:hover {
            background: #334155;
        }

        .link-btn {
            display: inline-block;
            padding: 6px 12px;
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .link-btn:hover {
            background: #2563eb;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.complete {
            background: #064e3b;
            color: #10b981;
        }

        .status-badge.incomplete {
            background: #7f1d1d;
            color: #ef4444;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e4e7eb;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #334155;
        }

        .filter-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .kpi-grid {
                grid-template-columns: 1fr 1fr;
            }

            .hac-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .ats-grid {
                grid-template-columns: repeat(6, 1fr);
            }

            .row-summary {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .complete-rows {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>

        var activeDH = 'All';
        var activeFilter = 'all';
        var allRecords = [];

        function normalize(raw) {
            return {
                locationId: raw.LocationID || '',
                dataHall: raw.DataHall || '',
                hac: parseInt(raw.HAC) || 0,
                row: parseInt(raw.Row) || 0,
                ats: parseInt(raw.ATS) || 0,
                serialNumber: raw.SerialNumber || '',
                softwareVersion: raw.SoftwareVersion || '',
                techName: raw.TechName || '',
                techId: raw.TechID || '',
                l3Date: raw.L3_Date || '',
                l3Pdf: raw.L3_PDF || '',
                l4Date: raw.L4_Date || '',
                l4TransferTime: raw.L4_TransferTime || '',
                l4Pdf: raw.L4_PDF || '',
                commissionComplete: raw['Commision Complete'] || 'No'
            };
        }

        function getStatus(rec) {
            if (rec.l3Date && rec.l4Date) return 'complete';
            if (rec.l3Date && !rec.l4Date) return 'l3only';
            if (!rec.l3Date && rec.l4Date) return 'l4only';
            return 'missing';
        }

        function setDH(dh, btn) {
            activeDH = dh;
            var buttons = document.querySelectorAll('.dh-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            btn.classList.add('active');
            render();
        }

        function filterTable(filter) {
            activeFilter = filter;
            var buttons = document.querySelectorAll('.filter-btn');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            event.target.classList.add('active');
            renderTable(getFilteredRecords());
        }

        function getFilteredRecords() {
            var filtered = allRecords.filter(function(rec) {
                if (activeDH !== 'All' && rec.dataHall !== activeDH) return false;
                return true;
            });
            return filtered;
        }

        function render() {
            var filtered = getFilteredRecords();
            renderKPIs(filtered);
            renderHACGrid(filtered);
            renderIncompleteRows(filtered);
            renderCompleteRows(filtered);
            renderTable(filtered);
        }

        function renderKPIs(filtered) {
            var total = activeDH === 'All' ? 864 : 432;
            var complete = 0;
            var l3only = 0;
            var l4only = 0;

            for (var i = 0; i < filtered.length; i++) {
                var status = getStatus(filtered[i]);
                if (status === 'complete') complete++;
                else if (status === 'l3only') l3only++;
                else if (status === 'l4only') l4only++;
            }
            
            // Missing Both = total units minus all units with any data
            var missing = total - complete - l3only - l4only;

            var completePercent = total > 0 ? Math.round((complete / total) * 100) : 0;

            var html = '';
            html += '<div class="kpi-card"><div class="kpi-value">' + total + '</div><div class="kpi-label">Total Units</div></div>';
            html += '<div class="kpi-card complete"><div class="kpi-value">' + complete + ' (' + completePercent + '%)</div><div class="kpi-label">Complete</div></div>';
            html += '<div class="kpi-card l3only"><div class="kpi-value">' + l3only + '</div><div class="kpi-label">L3 Only</div></div>';
            html += '<div class="kpi-card l4only"><div class="kpi-value">' + l4only + '</div><div class="kpi-label">L4 Only</div></div>';
            html += '<div class="kpi-card missing"><div class="kpi-value">' + missing + '</div><div class="kpi-label">Missing Both</div></div>';

            document.getElementById('kpi-grid').innerHTML = html;
        }

        function renderHACGrid(filtered) {
            var hacs = {};
            var hacCount = activeDH === 'All' ? 24 : 12;
            var unitsPerHAC = 36;

            for (var h = 1; h <= hacCount; h++) {
                var hacNum = activeDH === 'DH2' ? h + 12 : h;
                hacs[hacNum] = { complete: 0, total: 0 };
            }

            for (var i = 0; i < filtered.length; i++) {
                var rec = filtered[i];
                if (!hacs[rec.hac]) continue;
                hacs[rec.hac].total++;
                if (getStatus(rec) === 'complete') {
                    hacs[rec.hac].complete++;
                }
            }

            var html = '';
            for (var hacNum in hacs) {
                var hac = hacs[hacNum];
                var percent = hac.total > 0 ? Math.round((hac.complete / unitsPerHAC) * 100) : 0;
                var cssClass = percent === 100 ? 'complete' : percent > 0 ? 'partial' : 'incomplete';

                html += '<div class="hac-card ' + cssClass + '">';
                html += '<div class="hac-title">HAC ' + hacNum + '</div>';
                html += '<div class="hac-progress">' + hac.complete + ' / ' + unitsPerHAC + ' units</div>';
                html += '<div class="hac-percent">' + percent + '%</div>';
                html += '</div>';
            }

            document.getElementById('hac-grid').innerHTML = html;
            document.getElementById('hac-badge').textContent = Object.keys(hacs).length;
        }

        function renderIncompleteRows(filtered) {
            // Build a map of all possible rows for the active DH filter
            var allRows = {};
            
            // Determine which rows to show based on active DH
            var startHAC = 1;
            var endHAC = 24;
            if (activeDH === 'DH1') {
                startHAC = 1;
                endHAC = 12;
            } else if (activeDH === 'DH2') {
                startHAC = 13;
                endHAC = 24;
            }
            
            // Initialize all rows
            for (var h = startHAC; h <= endHAC; h++) {
                var row1 = (h - 1) * 2 + 1;
                var row2 = (h - 1) * 2 + 2;
                var dh = h <= 12 ? 'DH1' : 'DH2';
                
                var key1 = dh + '-HAC' + h + '-R' + row1;
                var key2 = dh + '-HAC' + h + '-R' + row2;
                
                allRows[key1] = {
                    dataHall: dh,
                    hac: h,
                    row: row1,
                    units: []
                };
                
                allRows[key2] = {
                    dataHall: dh,
                    hac: h,
                    row: row2,
                    units: []
                };
            }
            
            // Add actual unit data to rows
            for (var i = 0; i < filtered.length; i++) {
                var rec = filtered[i];
                var rowKey = rec.dataHall + '-HAC' + rec.hac + '-R' + rec.row;
                if (allRows[rowKey]) {
                    allRows[rowKey].units.push(rec);
                }
            }

            // Convert to array - show ALL rows
            var allRowsArray = [];
            for (var key in allRows) {
                allRowsArray.push(allRows[key]);
            }

            allRowsArray.sort(function(a, b) {
                if (a.dataHall !== b.dataHall) return a.dataHall.localeCompare(b.dataHall);
                if (a.hac !== b.hac) return a.hac - b.hac;
                return a.row - b.row;
            });

            var html = '';
            for (var i = 0; i < allRowsArray.length; i++) {
                html += renderIncompleteRowCard(allRowsArray[i]);
            }

            document.getElementById('incomplete-rows').innerHTML = html;
            document.getElementById('incomplete-badge').textContent = allRowsArray.length;
        }

        function renderIncompleteRowCard(row) {
            var complete = 0;
            var l3only = 0;
            var l4only = 0;
            var missing = 0;

            for (var i = 0; i < row.units.length; i++) {
                var status = getStatus(row.units[i]);
                if (status === 'complete') complete++;
                else if (status === 'l3only') l3only++;
                else if (status === 'l4only') l4only++;
                else missing++;
            }
            
            // Row is only truly complete if all 18 units exist and are complete
            var isRowComplete = (row.units.length === 18 && complete === 18);

            var rowId = 'row-' + row.dataHall + '-' + row.hac + '-' + row.row;
            
            var headerClass = isRowComplete ? 'row-header complete-row' : 'row-header';

            var html = '<div class="row-card">';
            html += '<div class="' + headerClass + '" onclick="toggleRow(\'' + rowId + '\')">';
            html += '<div class="row-title">' + row.dataHall + ' - HAC ' + row.hac + ' - Row ' + row.row + '</div>';
            html += '<div class="row-summary">';
            if (complete > 0) html += '<div class="row-stat complete"><span class="row-stat-label">Complete:</span> <span class="row-stat-value">' + complete + '</span></div>';
            if (l3only > 0) html += '<div class="row-stat l3only"><span class="row-stat-label">L3 Only:</span> <span class="row-stat-value">' + l3only + '</span></div>';
            if (l4only > 0) html += '<div class="row-stat l4only"><span class="row-stat-label">L4 Only:</span> <span class="row-stat-value">' + l4only + '</span></div>';
            if (missing > 0) html += '<div class="row-stat missing"><span class="row-stat-label">Missing:</span> <span class="row-stat-value">' + missing + '</span></div>';
            html += '</div>';
            html += '</div>';

            html += '<div class="row-content" id="' + rowId + '">';
            html += '<div class="ats-grid">';

            var unitsMap = {};
            for (var i = 0; i < row.units.length; i++) {
                unitsMap[row.units[i].ats] = row.units[i];
            }

            for (var atsNum = 1; atsNum <= 18; atsNum++) {
                var unit = unitsMap[atsNum];
                var status = unit ? getStatus(unit) : 'missing';
                var statusText = status === 'complete' ? 'L3+L4' : status === 'l3only' ? 'L3' : status === 'l4only' ? 'L4' : 'None';

                html += '<div class="ats-cell ' + status + '">';
                html += '<div class="ats-number">' + atsNum + '</div>';
                html += '<div class="ats-status">' + statusText + '</div>';
                html += '</div>';
            }

            html += '</div>';

            html += '<div class="legend">';
            html += '<div class="legend-item"><div class="legend-color complete"></div><span>Complete (L3+L4)</span></div>';
            html += '<div class="legend-item"><div class="legend-color l3only"></div><span>L3 Only</span></div>';
            html += '<div class="legend-item"><div class="legend-color l4only"></div><span>L4 Only</span></div>';
            html += '<div class="legend-item"><div class="legend-color missing"></div><span>Missing Both</span></div>';
            html += '</div>';

            html += '</div>';
            html += '</div>';

            return html;
        }

        function toggleRow(rowId) {
            var content = document.getElementById(rowId);
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
            } else {
                content.classList.add('expanded');
            }
        }

        function renderCompleteRows(filtered) {
            var rows = {};

            for (var i = 0; i < filtered.length; i++) {
                var rec = filtered[i];
                var rowKey = rec.dataHall + '-HAC' + rec.hac + '-R' + rec.row;
                if (!rows[rowKey]) {
                    rows[rowKey] = {
                        dataHall: rec.dataHall,
                        hac: rec.hac,
                        row: rec.row,
                        units: []
                    };
                }
                rows[rowKey].units.push(rec);
            }

            var completeRows = [];
            for (var key in rows) {
                var row = rows[key];
                if (row.units.length === 18) {
                    var allComplete = true;
                    for (var j = 0; j < row.units.length; j++) {
                        if (getStatus(row.units[j]) !== 'complete') {
                            allComplete = false;
                            break;
                        }
                    }
                    if (allComplete) {
                        completeRows.push(row);
                    }
                }
            }

            completeRows.sort(function(a, b) {
                if (a.dataHall !== b.dataHall) return a.dataHall.localeCompare(b.dataHall);
                if (a.hac !== b.hac) return a.hac - b.hac;
                return a.row - b.row;
            });

            var html = '';
            if (completeRows.length === 0) {
                html = '<div class="no-data">No complete rows yet</div>';
            } else {
                for (var i = 0; i < completeRows.length; i++) {
                    var row = completeRows[i];
                    html += '<div class="complete-row-item">' + row.dataHall + ' - HAC ' + row.hac + ' - Row ' + row.row + '</div>';
                }
            }

            document.getElementById('complete-rows').innerHTML = html;
            document.getElementById('complete-badge').textContent = completeRows.length;
        }

        function renderTable(filtered) {
            var records = filtered.slice();

            if (activeFilter !== 'all') {
                records = records.filter(function(rec) {
                    var status = getStatus(rec);
                    if (activeFilter === 'complete') return status === 'complete';
                    if (activeFilter === 'incomplete') return status !== 'complete';
                    if (activeFilter === 'l3only') return status === 'l3only';
                    if (activeFilter === 'l4only') return status === 'l4only';
                    return true;
                });
            }

            var html = '';
            for (var i = 0; i < records.length; i++) {
                var rec = records[i];
                var status = getStatus(rec);
                var statusClass = status === 'complete' ? 'complete' : 'incomplete';
                var statusText = status === 'complete' ? 'Complete' : status === 'l3only' ? 'L3 Only' : status === 'l4only' ? 'L4 Only' : 'Missing';

                html += '<tr>';
                html += '<td>' + rec.locationId + '</td>';
                html += '<td>' + rec.dataHall + '</td>';
                html += '<td>' + rec.hac + '</td>';
                html += '<td>' + rec.row + '</td>';
                html += '<td>' + rec.ats + '</td>';
                html += '<td>' + rec.serialNumber + '</td>';
                html += '<td>' + rec.softwareVersion + '</td>';
                html += '<td>' + rec.techName + '</td>';
                html += '<td>' + rec.l3Date + '</td>';
                html += '<td>' + (rec.l3Pdf ? '<a href="https://wbdiesel.sharepoint.com' + rec.l3Pdf + '" class="link-btn" target="_blank">View</a>' : '-') + '</td>';
                html += '<td>' + rec.l4Date + '</td>';
                html += '<td>' + rec.l4TransferTime + '</td>';
                html += '<td>' + (rec.l4Pdf ? '<a href="https://wbdiesel.sharepoint.com' + rec.l4Pdf + '" class="link-btn" target="_blank">View</a>' : '-') + '</td>';
                html += '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>';
                html += '</tr>';
            }

            document.getElementById('records-tbody').innerHTML = html;
            document.getElementById('records-badge').textContent = records.length;
        }

        window.onload = function() {
            if (RECORDS.length > 0) {
                for (var i = 0; i < RECORDS.length; i++) {
                    allRecords.push(normalize(RECORDS[i]));
                }
                render();
            }
        };
    </script>
</body>
</html>
